# main への push と Pull Request でビルドと Core のテストを実行する。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build -c Release
      - name: Test (Core)
        run: dotnet test tests/CraftPlanner.Core.Tests -c Release --no-build
